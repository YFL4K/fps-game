<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>疯狂的猪头佳 Mad Pig Li — three.js</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d12; font-family: Consolas, "Courier New", monospace; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* HUD */
  #crosshair { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.85); font-size: 30px; font-weight: bold; text-shadow: 0 0 6px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; user-select: none; }
  #stats { position: fixed; left: 16px; top: 14px; color: #d8e6ff; font-size: 15px; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,0.9); pointer-events: none; z-index: 10; user-select: none; white-space: pre; }
  #fps { position: fixed; right: 16px; top: 14px; color: #8fdb8f; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,0.9); pointer-events: none; z-index: 10; user-select: none; }
  #debugBadge { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); color: #ffd94a; font-size: 15px; font-weight: bold; background: rgba(20,20,30,0.75); border: 1px solid #ffd94a; padding: 4px 14px; border-radius: 4px; display: none; pointer-events: none; z-index: 10; user-select: none; }
  #versionTag { position: fixed; right: 16px; bottom: 14px; color: rgba(180,200,230,0.5); font-size: 12px; pointer-events: none; z-index: 10; user-select: none; }

  /* 关卡横幅 */
  #levelBanner { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); color: #8fd0ff; font-size: 26px; font-weight: bold; letter-spacing: 4px; text-shadow: 0 0 16px rgba(80,160,255,0.8); opacity: 0; transition: opacity 0.5s; pointer-events: none; z-index: 12; user-select: none; }
  #levelBanner .sub { font-size: 14px; letter-spacing: 1px; color: #b8c8e8; margin-top: 4px; text-align: center; }

  /* 爆头提示 */
  #headshotTag { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); color: #ff5f5f; font-size: 22px; font-weight: bold; text-shadow: 0 0 10px rgba(255,60,60,0.9); opacity: 0; pointer-events: none; z-index: 12; user-select: none; }

  /* 暴击/秒杀提示 */
  #critTag { position: fixed; left: 50%; top: 36%; transform: translateX(-50%); color: #ffaa00; font-size: 28px; font-weight: bold; text-shadow: 0 0 14px rgba(255,170,0,0.95); opacity: 0; transition: opacity 0.15s; pointer-events: none; z-index: 13; user-select: none; white-space: nowrap; }

  /* 命中标记（十字四角） */
  #hitmark { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; pointer-events: none; z-index: 11; opacity: 0; }
  #hitmark i { position: absolute; width: 7px; height: 2px; background: #fff; box-shadow: 0 0 4px rgba(255,255,255,0.9); }
  #hitmark.head i { background: #ff5f5f; box-shadow: 0 0 4px rgba(255,60,60,0.9); }
  #hitmark i.t { top: 0; left: 10px; }
  #hitmark i.b { bottom: 0; left: 10px; }
  #hitmark i.l { left: 0; top: 12px; }
  #hitmark i.r { right: 0; top: 12px; }
  @keyframes hitmarkAnim { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } }
  #hitmark.show { animation: hitmarkAnim 0.22s ease-out forwards; }

  /* 受伤红晕 */
  #hurtOverlay { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(255,0,0,0.5) 100%); opacity: 0; pointer-events: none; z-index: 8; transition: opacity 0.15s; }

  /* 核弹/大爆炸白闪 */
  #flashOverlay { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 25; }

  /* 提示条（宝箱/直升机/BOSS） */
  #toast { position: fixed; left: 50%; top: 26%; transform: translateX(-50%); background: rgba(10,15,25,0.85); border: 1px solid rgba(255,215,100,0.6); color: #ffdd88; font-size: 16px; font-weight: bold; padding: 8px 22px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 14; user-select: none; text-align: center; max-width: 80vw; }

  /* 错误面板 */
  #errPanel { position: fixed; left: 12px; bottom: 12px; max-width: 70vw; z-index: 40; pointer-events: none; }
  #errPanel div { background: rgba(120,20,20,0.92); color: #ffd7d7; border: 1px solid #ff6b6b; border-radius: 4px; padding: 4px 10px; margin-top: 4px; font-size: 12px; white-space: pre-wrap; }

  /* 开始/暂停遮罩 */
  #overlay { position: fixed; inset: 0; background: rgba(5,8,15,0.78); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; color: #e8f0ff; text-align: center; user-select: none; }
  /* v6.3 双排艺术标题：主标题「疯狂的猪头佳」+ 副标题「Mad Pig Li」 */
  #overlay h1 {
    margin: 0 0 4px;
    font-family: "STHupo", "华文琥珀", "STXingkai", "华文行楷", "KaiTi", "楷体", "Microsoft YaHei", "SimHei", sans-serif;
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 10px;
    line-height: 1.15;
    background: linear-gradient(180deg, #fff7c8 5%, #ffd94a 38%, #ff8a2a 72%, #ff4a2a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 rgba(80,20,0,0.9)) drop-shadow(0 0 18px rgba(255,140,40,0.85)) drop-shadow(0 0 42px rgba(255,80,30,0.5));
    animation: titleGlow 2.2s ease-in-out infinite alternate;
    white-space: nowrap;
  }
  #overlay .sub-en {
    margin: 0 0 20px;
    font-family: Impact, "Arial Black", "Cooper Black", "Trebuchet MS", sans-serif;
    font-size: 24px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 9px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff2a8, #ffd94a 55%, #ff9a3c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 rgba(60,20,0,0.9)) drop-shadow(0 0 12px rgba(255,200,60,0.7));
    white-space: nowrap;
  }
  @keyframes titleGlow {
    from { filter: drop-shadow(0 3px 0 rgba(80,20,0,0.9)) drop-shadow(0 0 14px rgba(255,140,40,0.65)) drop-shadow(0 0 34px rgba(255,80,30,0.35)); }
    to   { filter: drop-shadow(0 3px 0 rgba(80,20,0,0.9)) drop-shadow(0 0 24px rgba(255,170,60,1)) drop-shadow(0 0 56px rgba(255,90,35,0.7)); }
  }
  #overlay .sub { font-size: 16px; color: #b8c8e8; margin-bottom: 22px; }
  #overlay .keys { font-size: 13px; color: #9fb0d0; line-height: 1.9; margin-bottom: 26px; }
  #overlay .keys b { color: #ffd94a; }
  #overlay .keys .warn { color: #ff8a7a; }
  #overlay button { background: #2a6fd8; color: #fff; border: none; padding: 12px 42px; font-size: 17px; border-radius: 6px; cursor: pointer; letter-spacing: 2px; font-family: inherit; }
  #overlay button:hover { background: #3a80ea; }
  #overlay.fatal button { display: none; }
</style>
</head>

<div id="crosshair">+</div>

<div id="fpsTestBar" style="position:fixed;top:0;left:0;z-index:99999;display:none;background:rgba(0,0,0,0.7);color:#0f0;font:12px monospace;padding:4px">

<script>
(function () {
  'use strict';

  /* ================= 0. 错误面板与全局捕获 ================= */
  var errPanel = document.getElementById('errPanel');
  function showError(msg) {
    var d = document.createElement('div');
    d.textContent = '⚠ ' + msg;
    errPanel.appendChild(d);
    console.error('[FPS]', msg);
  }
  window.addEventListener('error', function (e) {
    if (e && e.message) showError('运行时错误: ' + e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('Promise 错误: ' + (e && e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  if (window.__MOD_ERRS && window.__MOD_ERRS.length) {
    window.__MOD_ERRS.forEach(function (s) { showError('模块加载失败: ' + s); });
  }

  var overlay = document.getElementById('overlay');
  var overlaySub = document.getElementById('overlaySub');
  var startBtn = document.getElementById('startBtn');
  var statsEl = document.getElementById('stats');
  var fpsEl = document.getElementById('fps');
  var debugBadge = document.getElementById('debugBadge');
  var hurtEl = document.getElementById('hurtOverlay');
  var flashEl = document.getElementById('flashOverlay');
  var toastEl = document.getElementById('toast');
  var appEl = document.getElementById('app');
  var hitmarkEl = document.getElementById('hitmark');
  var headshotEl = document.getElementById('headshotTag');
  var critTagEl = document.getElementById('critTag');
  var levelBannerEl = document.getElementById('levelBanner');
  var levelBannerTitle = document.getElementById('levelBannerTitle');
  var levelBannerSub = document.getElementById('levelBannerSub');

  if (typeof THREE === 'undefined') {
    overlay.classList.add('fatal');
    overlay.querySelector('h1').textContent = 'three.js 加载失败';
    overlaySub.textContent = '请确认 three.min.js 与 index.html 在同一目录，或检查网络后重试。';
    startBtn.style.display = 'none';
    showError('致命: three.js 未加载，游戏无法启动');
    return;
  }

  /* ================= 1. 场景布局（缺失时兜底） ================= */
  var LAYOUT = window.SCENE_LAYOUT;
  var layoutMissing = false;
  if (!LAYOUT) {
    layoutMissing = true;
    LAYOUT = {
      playerSpawn: { position: [0, 1.6, 12], yaw: 0 },
      world: { fogColor: 0x8fa3bf, fogNear: 30, fogFar: 140, gravity: -22, playerSpeed: 6, sprintSpeed: 9, jumpSpeed: 8, eyeHeight: 1.6, playerRadius: 0.4, playerHeight: 1.7, maxHealth: 100 },
      lights: [
        { type: 'ambient', color: 0x8899bb, intensity: 0.6 },
        { type: 'directional', color: 0xfff0dd, intensity: 1.2, position: [12, 25, 8], shadow: true }
      ],
      entities: [
        { id: 'floor-1', model: 'floor', position: [0, 0, 0], rotation: [0, 0, 0], scale: [1, 1, 1], collision: false },
        { id: 'wall-n', model: 'wall', position: [0, 0, -45], rotation: [0, 0, 0], scale: [11.5, 1, 1], collision: true },
        { id: 'wall-s', model: 'wall', position: [0, 0, 45], rotation: [0, 0, 0], scale: [11.5, 1, 1], collision: true },
        { id: 'wall-e', model: 'wall', position: [45, 0, 0], rotation: [0, Math.PI / 2, 0], scale: [11.5, 1, 1], collision: true },
        { id: 'wall-w', model: 'wall', position: [-45, 0, 0], rotation: [0, -Math.PI / 2, 0], scale: [11.5, 1, 1], collision: true }
      ]
    };
    showError('scene-layout.js 加载失败，使用内置默认场景');
  }
  var WORLD = LAYOUT.world || {};
  var SPAWN = LAYOUT.playerSpawn || { position: [0, 1.6, 6], yaw: 0 };

  /* ================= 1.5 武器类型表（多武器 + 火箭筒 AOE + 喷火器） ================= */
  var GUN_TYPES = {
    pistol:     { name: '手枪',     damage: 28, mag: 12,  maxAmmo: 96,  fireRate: 4.0,  reload: 0.78, spread: 0.012, pellets: 1,   range: 70,   auto: false },
    rifle:      { name: '步枪',     damage: 20, mag: 30,  maxAmmo: 240, fireRate: 9.0,  reload: 1.17, spread: 0.02,  pellets: 1,   range: 120,  auto: true },
    flamethrower: { name: '喷火器', damage: 108, mag: 5,  maxAmmo: 30,  fireRate: 12.0, reload: 2.0,  spread: 0.08,  pellets: 1,   range: 36,   auto: true, flame: true, flameRadius: 4.5 },  // v6.4: 伤害54→108(+100%) 射程18→36(+100%) 范围3.0→4.5(+50%)
    sniper:     { name: '狙击枪',   damage: 120, mag: 5,  maxAmmo: 40,  fireRate: 0.9,  reload: 1.82, spread: 0.003, pellets: 1,   range: 260,  auto: false },
    rocket:     { name: '火箭筒',   damage: 140, mag: 5,  maxAmmo: 0,   fireRate: 0.85, reload: 2.21, spread: 0.01,  pellets: 1,   range: 240,  auto: false, aoe: { radius: 6, damage: 170 } }
  };
  var GUN_ORDER = ['pistol', 'rifle', 'flamethrower', 'sniper', 'rocket'];

  /* ================= 1.6 关卡配置（v6：任务模式 + 敌人持续刷新） ================= */
  var LEVELS = [
    { name: '第 1 关', title: '清剿街区', mission: '击杀 8 名敌人',
      killTarget: 8, boss: null, pool: { human: 4, monster: 2 }, stats: { damage: 0, health: 0 } },
    { name: '第 2 关', title: '火力围猎', mission: '击杀 16 名敌人',
      killTarget: 16, boss: null, pool: { human: 6, monster: 4 }, stats: { damage: 2, health: 20 } },
    { name: '第 3 关', title: '巨兽苏醒', mission: '击杀 12 名敌人后 BOSS 现身，击败 BOSS 过关',
      killTarget: 12, boss: { trigger: 12, health: 1100, damage: 18, speed: 0.9, scale: 3.0 },
      pool: { human: 5, monster: 4 }, stats: { damage: 4, health: 40 } },
    { name: '第 4 关', title: '绞肉机', mission: '击杀 18 名敌人后 BOSS 现身，击败 BOSS 过关',
      killTarget: 18, boss: { trigger: 18, health: 1600, damage: 22, speed: 1.1, scale: 3.4 },
      pool: { human: 7, monster: 6 }, stats: { damage: 6, health: 60 } },
    { name: '第 5 关', title: '终焉之战', mission: '击杀 26 名敌人后 BOSS 现身，击败 BOSS 过关',
      killTarget: 26, boss: { trigger: 26, health: 2400, damage: 26, speed: 1.3, scale: 4.0 },
      pool: { human: 10, monster: 8 }, stats: { damage: 8, health: 90 } }
  ];
  var levelIndex = 0;
  var levelKills = 0;
  var levelCleared = false;
  var bossAppeared = false;
  var bossAlive = false;
  var waveQueue = [];
  var waveTimer = 1.0;
  var heliTimer = 20;
  var heliSpawnedCount = 0;
  var chestSpawnedCount = 0;
  // v6.4 宝箱机制：每关 30% 几率出现宝箱（首杀敌人时在击杀点附近刷出），每关最多 1 个
  var levelHasChest = false;
  var chestSpawnedThisLevel = false;
  var dynCounter = 0;
  var currentLayout = null;  // 记录当前加载的布局版本

  /* ================= 2. 渲染器 / 场景 / 相机 ================= */
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  appEl.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(WORLD.fogColor || 0x8fa3bf, WORLD.fogNear || 30, WORLD.fogFar || 140);
  scene.background = new THREE.Color(0x8fa3bf);

  var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  /* ================= 3. 灯光（光影效果） ================= */
  (LAYOUT.lights || []).forEach(function (lc) {
    var light = null;
    if (lc.type === 'ambient') {
      light = new THREE.AmbientLight(lc.color, lc.intensity);
    } else if (lc.type === 'directional') {
      light = new THREE.DirectionalLight(lc.color, lc.intensity);
      light.position.set(lc.position[0], lc.position[1], lc.position[2]);
      if (lc.shadow) {
        light.castShadow = true;
        light.shadow.mapSize.width = 1024;
        light.shadow.mapSize.height = 1024;
        light.shadow.camera.near = 1;
        light.shadow.camera.far = 160;
        light.shadow.camera.left = -60;
        light.shadow.camera.right = 60;
        light.shadow.camera.top = 60;
        light.shadow.camera.bottom = -60;
      }
    } else if (lc.type === 'point') {
      light = new THREE.PointLight(lc.color, lc.intensity, lc.distance || 25, 1);
      light.position.set(lc.position[0], lc.position[1], lc.position[2]);
    }
    if (light) scene.add(light);
  });

  // 枪口闪光点光源（挂在相机上，射击时脉冲）
  var muzzleLight = new THREE.PointLight(0xffaa44, 0, 14, 1);
  muzzleLight.position.set(0.2, -0.15, -0.6);
  camera.add(muzzleLight);

  /* ================= 4. 通用实体系统 ================= */
  var entities = [];
  var colliders = [];
  var layoutRecs = [];
  var rockets = [];
  var fx = [];
  var screenShake = 0;
  var playerPosVec = new THREE.Vector3();

  var ctx = {
    THREE: THREE,
    scene: scene,
    camera: camera,
    player: null,
    sfx: null,
    hitPlayer: null,
    shootDamage: 15,
    currentDamage: 15,
    oneShotKill: false,

    var d = buf.getChannelData(0);

    var src = AC.createBufferSource(); src.buffer = buf;

    src.connect(f); f.connect(g); g.connect(AC.destination);

  function tryShoot() {

    if (player.ammo <= 0) { startReload(); return; }
    
    // 喷火器（v6.2）：持续喷火，每发子弹 = 15 秒（ammo 按时间消耗），火焰持续伤害锥体

  }

  /**
   * v6.2 喷火器持续伤害：以喷口为起点、沿视线方向的圆柱判定
   *  - 射程 36（+100%）、伤害 54/秒（+200%）、伤害半径 3.0（基础 2.0 +50%）
   *  - 每发子弹可持续 15 秒喷火（ammo 按时间消耗）
   *  - 狂暴模式：伤害 ×1.5，命中点附带小爆炸
   */
  function applyFlameDamage(dtTick) {
    var gt = GUN_TYPES[player.gun];
    if (!gt || !gt.flame || state !== 'playing') return;
    var origin = getMuzzleWorld();
    var dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    var radius = gt.flameRadius || 3.0;
    var dmg = gt.damage * dtTick * (player.berserk ? 1.5 : 1);
    var pTo = new THREE.Vector3();
    var pToXZ = new THREE.Vector3();
    var dirXZ = new THREE.Vector3();
    var projXZ = new THREE.Vector3();
    ctx.oneShotKill = false;
    var hitCount = 0;
    dirXZ.set(dir.x, 0, dir.z).normalize();
    for (var i = 0; i < entities.length; i++) {
      var rec = entities[i];
      if (!rec.alive) continue;
      // 所有敌人（enemy/spider/boss 均有 enemyType）+ 直升机
      if (!rec.cfg.enemyType && rec.cfg.model !== 'helicopter') continue;
      pTo.subVectors(rec.inst.position, origin);
      // 水平面锥形判定（火焰喷射在水平方向扩散）
      pToXZ.set(pTo.x, 0, pTo.z);
      var t = pToXZ.dot(dirXZ);
      if (t < 0.2 || t > gt.range) continue;
      projXZ.copy(dirXZ).multiplyScalar(t);
      // 锥形判定：越远伤害范围越宽（flameRadius=3.0 基础 2.0 +50%）
      var hitR = 0.5 + radius * (t / gt.range);
      if (pToXZ.distanceTo(projXZ) > hitR) continue;
      // 竖直高度带：火焰喷射带高度 ±2.6m
      if (Math.abs(pTo.y) > 2.6) continue;
      ctx.currentDamage = dmg;
      hitCount++;
      if (rec.def && rec.def.onHit) {
        try { rec.def.onHit(rec.inst, rec.inst.position.clone(), ctx); }
        catch (e) { showError('喷火命中失败 (' + rec.cfg.id + '): ' + e.message); }
      } else if (rec.inst.userData && typeof rec.inst.userData.takeDamage === 'function') {
        rec.inst.userData.takeDamage(dmg);
      }
      if (player.berserk) explode(rec.inst.position, 1.8, dmg * 0.5, { noPlayer: true, noVisual: true, quiet: true });
    }
    _flameHitCount += hitCount;
  }

  function fireRocket(from, dir, damage, aoe) {
    var mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.09, 0.07, 0.62, 8),
      new THREE.MeshBasicMaterial({ color: 0xff7733 })
    );
    mesh.userData.noHit = true;
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone());
    mesh.position.copy(from);
    scene.add(mesh);
    rockets.push({ mesh: mesh, vel: dir.clone().multiplyScalar(44), life: 4, damage: damage, aoe: aoe, smokeTimer: 0 });
    if (sfx) sfx.playRocket();
  }

  function updateRockets(dt) {
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.life -= dt;
      r.mesh.position.addScaledVector(r.vel, dt);
      r.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), r.vel.clone().normalize());

      // 命中检测：沿速度方向投射
      raycaster.set(r.mesh.position, r.vel.clone().normalize());
      var hits = raycaster.intersectObjects(scene.children, true);
      var hitPoint = null, hitRec = null, hitDist = 1e9;
      for (var j = 0; j < hits.length; j++) {
        var o = hits[j].object;
        if (o.userData && o.userData.noHit) continue;
        var id = o.userData && o.userData.entityId;
        if (id) {
          var rec = findEntityById(id);
          if (rec && rec.alive) {
            if (hits[j].distance < hitDist) { hitDist = hits[j].distance; hitPoint = hits[j].point.clone(); hitRec = rec; }
            continue;
          }
        }
        if (hits[j].distance < hitDist) { hitDist = hits[j].distance; hitPoint = hits[j].point.clone(); }
      }
      if (hitPoint && hitDist < 2.2) {
        if (hitRec) {
          try {
            if (hitRec.def && hitRec.def.onHit) hitRec.def.onHit(hitRec.inst, hitPoint, ctx);
            else if (hitRec.inst.userData && typeof hitRec.inst.userData.takeDamage === 'function') hitRec.inst.userData.takeDamage(r.damage);
          } catch (e) { showError('火箭命中处理失败: ' + e.message); }
          score += hitRec.cfg.score || 0;
          if (hitRec.inst.userData && hitRec.inst.userData.destroyed) {
            spawnDebris(hitRec);
            destroyEntity(hitRec);
          }
        }
        explode(hitPoint, r.aoe.radius, r.damage, {});
        scene.remove(r.mesh);
        rockets.splice(i, 1);
        continue;
      }

      // 尾烟
      r.smokeTimer -= dt;
      if (r.smokeTimer <= 0) {
        r.smokeTimer = 0.035;
        var sm = new THREE.Mesh(
          new THREE.SphereGeometry(0.16, 5, 5),
          new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.55 })
        );
        sm.position.copy(r.mesh.position);
        scene.add(sm);
        fx.push({ type: 'smoke', obj: sm, vel: new THREE.Vector3((Math.random() - 0.5) * 1.4, Math.random() * 1.2 + 0.4, (Math.random() - 0.5) * 1.4), life: 1.0, maxLife: 1.0, growTo: 1.8 });
      }
      if (r.life <= 0) {
        explode(r.mesh.position.clone(), r.aoe.radius, r.damage, {});
        scene.remove(r.mesh);
        rockets.splice(i, 1);
      }
    }
  }

  function spawnDebris(arg, count, size, color) {
    var point, cnt, sz, col = color, spread;
    if (arg && arg.cfg) {
      // 按实体取 AABB 采样
      var ab = new THREE.Box3().setFromObject(arg.inst);
      var szv = new THREE.Vector3();
      ab.getSize(szv);
      point = new THREE.Vector3((ab.min.x + ab.max.x) / 2, (ab.min.y + ab.max.y) / 2, (ab.min.z + ab.max.z) / 2);
      cnt = Math.min(28, Math.max(8, Math.floor(szv.x * szv.y * szv.z * 0.6)));
      sz = Math.min(0.55, Math.max(0.14, szv.x * 0.15));
      spread = new THREE.Vector3(szv.x * 0.55, szv.y * 0.55, szv.z * 0.55);
      if (!col) {
        arg.inst.traverse(function (o) {
          if (o.isMesh && o.material && o.material.color && !col) col = o.material.color.getHex();
        });
      }
    } else {
      point = arg;
      cnt = count || 10;
      sz = size || 0.4;
      spread = new THREE.Vector3(sz * 2, sz * 2, sz * 2);
    }
    if (col === undefined) col = 0x8a6b3c;
    for (var i = 0; i < cnt; i++) {
      var m = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: col, roughness: 0.85, transparent: true, opacity: 1 })
      );

      m.scale.set(s, s * (0.4 + Math.random() * 0.9), s);
      m.position.set(
        point.x + (Math.random() - 0.5) * spread.x,
        point.y + (Math.random() - 0.5) * spread.y,
        point.z + (Math.random() - 0.5) * spread.z

  /**
   * 核心爆炸：
   *  - 伤害范围内敌人/直升机（takeDamage）
   *  - 伤害玩家（可关闭）
   *  - 摧毁范围内可破坏模型（碎片 + 油桶/TNT 连环引爆）
   */
  function explode(point, radius, damage, opts) {
    opts = opts || {};
    radius = radius || 5;
    var pt = point.clone ? point.clone() : new THREE.Vector3(point[0], point[1], point[2]);

    if (!opts.noVisual) spawnExplosionVisual(pt, radius, opts);
    if (sfx && !opts.quiet) sfx.playExplode();
    if (!opts.quiet) screenShake = Math.min(1.2, screenShake + (opts.nuke ? 1.2 : 0.4));

    var pendingChains = [];

    // 伤害敌人/直升机
    if (damage > 0 && !opts.noEnemies) {
      for (var i = 0; i < entities.length; i++) {
        var rec = entities[i];
        if (!rec.alive) continue;
        var u = rec.inst.userData;
        if (u && u.destroyed) continue;
        var d = rec.inst.position.distanceTo(pt);
        if (d < radius * 2 && u && typeof u.takeDamage === 'function') {
          u.takeDamage(damage * Math.max(0.25, 1 - d / (radius * 2)));
        }
      }
    }

    // 伤害玩家
    if (damage > 0 && !opts.noPlayer && !player.dead) {
      playerPosVec.set(player.pos.x, player.pos.y + 0.9, player.pos.z);
      var pd = playerPosVec.distanceTo(pt);
      if (pd < radius * 2) {
        hitPlayer(damage * 0.55 * Math.max(0.25, 1 - pd / (radius * 2)));
      }
    }

    // 摧毁可破坏模型 + 收集连环引爆（宽限期内的新掉落物不受爆炸波及）
    for (var k = entities.length - 1; k >= 0; k--) {
      var rec2 = entities[k];
      if (!rec2.alive) continue;
      if (!isDestructible(rec2)) continue;
      if (rec2.cfg.grace && ctx.time - rec2.spawnTime < rec2.cfg.grace) continue;
      var u2 = rec2.inst.userData;
      if (u2 && u2.destroyed) continue;
      var d2 = rec2.inst.position.distanceTo(pt);
      if (d2 < radius) {
        if (!u2) rec2.inst.userData = {};
        rec2.inst.userData.destroyed = true;
        spawnDebris(rec2);
        destroyEntity(rec2);
        if ((rec2.cfg.model === 'barrel' || rec2.cfg.model === 'tnt') && !opts.noChain) {
          pendingChains.push(new THREE.Vector3(rec2.inst.position.x, rec2.inst.position.y, rec2.inst.position.z));
        }
      }
    }

    for (var c = 0; c < pendingChains.length; c++) {
      explode(pendingChains[c], 5.5, 60, { chain: true, quiet: true, noPlayer: opts.noPlayer });
    }
  }
  ctx.explode = explode;

  function applyChest(rec) {
    // v6.4 道具随机出现：核弹 10%，移动速度 / 伤害 / 生命 各 30%
    var r = Math.random();
    var item;
    if (r < 0.10) item = ITEMS[3];
    else if (r < 0.40) item = ITEMS[0];
    else if (r < 0.70) item = ITEMS[1];
    else item = ITEMS[2];
    if (item.id === 'speed') {
      player.buffs.speed = 30;
    } else if (item.id === 'damage') {
      player.buffs.damage = 30;
    } else if (item.id === 'health') {
      // 记录当前原始 maxHealth，用于超时后恢复
      player.buffs.healthMax = player.maxHealth;
      player.buffs.healthTimer = 30;
      player.maxHealth = Math.min(1200, Math.round(player.maxHealth * 3));
      player.health = player.maxHealth;
    } else if (item.id === 'nuke') {
      player.nukes += 1;
    }
    showToast('宝箱：' + item.name + ' — ' + item.desc, item.color);
    if (sfx) sfx.playChest();

    // 30% 概率同时掉落弹药
    if (Math.random() < 0.30) spawnAmmoDrop(rec.inst.position.clone());

  function applyPickup(rec) {
    if (!rec.cfg.kind) return;
    if (rec.cfg.kind === 'chest') { applyChest(rec); return; }
    if (rec.cfg.kind === 'weapon' && rec.cfg.type) {
      if (rec.cfg.type === 'rocket') player.hasRocket = true;
      if (rec.cfg.type === 'flamethrower') player.flameReserve = Math.min(60, player.flameReserve + 15);
      if (rec.cfg.type === player.gun) {
        var wgt = GUN_TYPES[player.gun];
        player.ammo = wgt.mag;
        player.reserve = (rec.cfg.type === 'flamethrower') ? player.flameReserve : wgt.maxAmmo;
        sfx.playPickup();
      } else {
        switchGun(rec.cfg.type);
      }
      respawnEntity(rec);
      return;
    }
    if (rec.cfg.kind === 'health') {
      player.health = Math.min(player.maxHealth, player.health + 30);
    } else if (rec.cfg.kind === 'ammo') {
      if (rec.cfg.type === 'flame') {
        player.flameReserve = Math.min(60, player.flameReserve + 5);
        if (GUN_TYPES[player.gun].flame) player.reserve = player.flameReserve;
        showToast('🔥 喷火弹药 +5（备用 ' + player.flameReserve + '）', 0xff8844);
      } else {
        var gt = GUN_TYPES[player.gun];
        player.reserve = Math.min(gt.maxAmmo, player.reserve + gt.mag * 1.5);
      }
    }
    sfx.playPickup();
    respawnEntity(rec);
  }

  /* ================= 11. 关卡系统（v3） ================= */
  function getLevel() {
    return LEVELS[Math.min(levelIndex, LEVELS.length - 1)];
  }
  function clearAllDynamic() {
    for (var i = entities.length - 1; i >= 0; i--) {
      var rec = entities[i];
      if (rec.cfg && rec.cfg.dynamic) destroyEntity(rec);
    }
    for (var r = rockets.length - 1; r >= 0; r--) {
      scene.remove(rockets[r].mesh);
      rockets.splice(r, 1);
    }
  }
  function rebuildDestroyedMapObjects() {
    // 检查是否需要重建整个场景（关卡切换）
    var targetLayout = getTargetLayout();
    if (currentLayout !== targetLayout) {
      // 重建整个场景
      currentLayout = targetLayout;
      rebuildFullScene(targetLayout);
      return;
    }
    // 只重建被破坏的静态对象
    for (var i = 0; i < layoutRecs.length; i++) {
      var rec = layoutRecs[i];
      if (!rec.alive) rebuildEntity(rec);
    }
  }

  function getTargetLayout() {
    if (levelIndex >= LEVELS.length) return null;
    // 根据关卡选择对应布局（支持随机生成的多个版本）
    if (levelIndex === 0) return window.SCENE_LAYOUT;
    if (levelIndex === 1) return window.SCENE_LAYOUT_LEVEL2 || window.SCENE_LAYOUT;
    if (levelIndex === 2) return window.SCENE_LAYOUT_LEVEL3 || window.SCENE_LAYOUT;
    if (levelIndex === 3) return window.SCENE_LAYOUT_LEVEL4 || window.SCENE_LAYOUT;
    if (levelIndex === 4) return window.SCENE_LAYOUT_LEVEL5 || window.SCENE_LAYOUT;
    return window.SCENE_LAYOUT;
  }

  function rebuildFullScene(layoutObj) {
    // 保存当前场景状态
    var currentSpawn = { x: player.pos.x, y: player.pos.y, z: player.pos.z };
    
    // 清空场景中的静态实体（layoutRecs 中的）
    for (var i = entities.length - 1; i >= 0; i--) {
      var rec = entities[i];
      if (rec.cfg && !rec.cfg.dynamic) {
        destroyEntity(rec);
      }
    }
    layoutRecs = [];
    colliders = [];
    
    // 重建灯光和雾
    rebuildLights(layoutObj);
    
    // 重建实体
    (layoutObj.entities || []).forEach(function (cfg) {
      layoutRecs.push(buildEntity(cfg));
    });
    
    // 恢复玩家位置（使用新的出生点）
    var newSpawn = layoutObj.playerSpawn || SPAWN;
    player.pos.set(newSpawn.position[0], newSpawn.position[1], newSpawn.position[2]);
    player.yaw = newSpawn.yaw || 0;
    player.pitch = 0;
    player.vel.set(0, 0, 0);
    camera.position.set(player.pos.x, player.pos.y + (W.eyeHeight || 1.6), player.pos.z);
  }

  function rebuildLights(layout) {
    // 移除旧的灯光
    var toRemove = [];
    scene.traverse(function (child) {
      if (child.isLight) toRemove.push(child);
    });
    toRemove.forEach(function (light) { scene.remove(light); });
    
    // 添加新灯光
    (layout.lights || []).forEach(function (lc) {
      var light = null;
      if (lc.type === 'ambient') {
        light = new THREE.AmbientLight(lc.color, lc.intensity);
      } else if (lc.type === 'directional') {
        light = new THREE.DirectionalLight(lc.color, lc.intensity);
        light.position.set(lc.position[0], lc.position[1], lc.position[2]);
        if (lc.shadow) {
          light.castShadow = true;
          light.shadow.mapSize.width = 1024;
          light.shadow.mapSize.height = 1024;
          light.shadow.camera.near = 1;
          light.shadow.camera.far = 160;
          light.shadow.camera.left = -60;
          light.shadow.camera.right = 60;
          light.shadow.camera.top = 60;
          light.shadow.camera.bottom = -60;
        }
      } else if (lc.type === 'point') {
        light = new THREE.PointLight(lc.color, lc.intensity, lc.distance || 25, 1);
        light.position.set(lc.position[0], lc.position[1], lc.position[2]);
      }
      if (light) scene.add(light);
    });
    
    // 更新雾
    if (layout.world && layout.world.fogColor) {
      scene.fog = new THREE.Fog(layout.world.fogColor, layout.world.fogNear || 30, layout.world.fogFar || 140);
      scene.background = new THREE.Color(layout.world.fogColor);
    }
  }
  function showLevelBanner() {
    var L = getLevel();
    levelBannerTitle.textContent = L.name + ' 「' + L.title + '」';
    levelBannerSub.textContent = L.mission + (L.boss ? '（BOSS 触发: 击杀 ' + L.boss.trigger + ' 名敌人）' : '');
    levelBannerEl.style.opacity = '1';
    setTimeout(function () { levelBannerEl.style.opacity = '0'; }, 2800);
  }

  function buildWave(L) {
    waveQueue = [];
    var pool = L.pool || {};
    ['human', 'monster'].forEach(function (t) {
      var n = pool[t] || 0;
      for (var i = 0; i < n; i++) waveQueue.push(t);
    });
    // v6: 蜘蛛敌人随机加入（从第二关开始）
    if (levelIndex >= 1) {
      var spiderCount = randInt(0, 2 + levelIndex);
      for (var i = 0; i < spiderCount; i++) waveQueue.push('spider');
    }
    for (var j = waveQueue.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = waveQueue[j]; waveQueue[j] = waveQueue[k]; waveQueue[k] = tmp;
    }
    waveTimer = 1.0;
  }

  function randomSpawnPos() {
    var ab = new THREE.Box3();
    for (var tries = 0; tries < 26; tries++) {
      var x = (Math.random() - 0.5) * 74;
      var z = (Math.random() - 0.5) * 74;
      var d = Math.sqrt((x - player.pos.x) * (x - player.pos.x) + (z - player.pos.z) * (z - player.pos.z));
      if (d < 14) continue;
      var bad = false;
      for (var i = 0; i < colliders.length; i++) {
        var rec = colliders[i];
        if (!rec.alive) continue;
        ab.setFromObject(rec.inst);
        if (x > ab.min.x - 0.8 && x < ab.max.x + 0.8 && z > ab.min.z - 0.8 && z < ab.max.z + 0.8) { bad = true; break; }
      }
      if (bad) continue;
      return new THREE.Vector3(x, 0, z);
    }
    return new THREE.Vector3((Math.random() - 0.5) * 70, 0, -24);
  }

  function helicopterAlive() {
    for (var i = 0; i < entities.length; i++) {

  function updateWaves(dt) {
    if (state !== 'playing') return;
    var L = getLevel();

    // 波次随机刷怪
    // 波次随机刷怪 — 当波次耗尽但击杀数未达标时补充新波次
    if (waveQueue.length === 0 && levelKills < L.killTarget) {
      buildWave(L);
    }
    if (waveQueue.length) {
      waveTimer -= dt;
      if (waveTimer <= 0) {
        var n = Math.min(3, waveQueue.length);
        for (var i = 0; i < n; i++) {
          var t = waveQueue.shift();
          spawnEnemy(t, randomSpawnPos());
        }
        waveTimer = 3.0 + Math.random() * 1.6;
      }
    }

    // BOSS 触发条件
    if (L.boss && !bossAppeared && levelKills >= L.boss.trigger) {
      spawnBoss();
    }

    // 直升机随机出现（每关最多 2 次）
    if (heliSpawnedCount < 2) {
      heliTimer -= dt;
      if (heliTimer <= 0) {
        if (!helicopterAlive()) spawnHelicopter();
        heliTimer = 32 + Math.random() * 18;
      }
    }
  }

  function checkMissionComplete() {
    if (levelCleared) return;
    var L = getLevel();
    if (L.boss) {
      // v6.4 修复：BOSS 关卡必须「BOSS 已现身且被击败」才过关
      // （旧代码仅判断 !bossAlive，而 bossAlive 在 BOSS 出现前就是 false，
      //   导致第3关起只击杀 1 名敌人就误判过关）
      if (bossAppeared && !bossAlive) completeLevel();
    } else if (levelKills >= L.killTarget) {
      completeLevel();
    }
  }
  function completeLevel() {
    if (levelCleared) return;
    levelCleared = true;
    state = 'complete';
    levelBannerTitle.textContent = '★ 任务完成';
    levelBannerSub.textContent = '按 Enter 进入下一关';

  function nextLevel() {

    levelIndex++;

    bossAppeared = false;
    bossAlive = false;
    heliSpawnedCount = 0;
    chestSpawnedCount = 0;
    // v6.4 每关随机出宝箱几率 30%
    levelHasChest = Math.random() < 0.30;
    chestSpawnedThisLevel = false;
    clearAllDynamic();
    // 重建场景（如果切换到新关卡布局）
    rebuildFullScene(getTargetLayout());
    var L = getLevel();
    buildWave(L);
    player.health = Math.min(player.maxHealth, player.health + 50);
    var gt = GUN_TYPES[player.gun];
    player.ammo = gt.mag;
    player.reserve = gt.maxAmmo;
    showLevelBanner();
    if (sfx) sfx.playLevelUp();
    // v5: 确保状态正确，防止进关后无法操作
    state = 'playing';
    overlay.style.display = 'none';
    requestLock();

  function resetGame() {
    state = 'menu';
    levelIndex = 0;
    levelKills = 0;
    levelCleared = false;
    bossAppeared = false;
    bossAlive = false;
    heliSpawnedCount = 0;
    chestSpawnedCount = 0;

    clearAllDynamic();
    rebuildFullScene(currentLayout);
    player.dead = false;
    player.health = W.maxHealth || 100;
    player.maxHealth = W.maxHealth || 100;

    player.nukes = 0;
    player.hasRocket = false;
    player.flameReserve = 30;

    player.gun = 'pistol';

  ctx.onEnemyKilled = function (pos, type) {

    if (levelHasChest && !chestSpawnedThisLevel) {
      chestSpawnedThisLevel = true;

  function detonateNuke() {
    if (player.nukes <= 0 || player.dead || state !== 'playing') return;
    player.nukes--;
    if (sfx) sfx.playNuke();

    var nukeDmg = Math.round(player.maxHealth * 0.30);
    hitPlayer(nukeDmg);
    if (player.dead) {
      overlaySub.textContent = '你被核弹杀死了！得分 ' + score + ' — 按 Enter 重新开始';
      overlay.querySelector('h1').textContent = '☢ 核爆致命';
      overlay.style.display = 'flex';

    showToast('☢ 核弹引爆！继续战斗', 0xffcc22);

  /* ================= 12. 玩家移动 / 碰撞 / 调试飞行 ================= */
  var tmpVec = new THREE.Vector3();
  var tmpVec2 = new THREE.Vector3();
  var forward = new THREE.Vector3();
  var right = new THREE.Vector3();
  var box = new THREE.Box3();

  function updatePlayer(dt) {
    // v6.2 狂暴模式：生命值 ≤ 15% 自动触发（生命恢复后解除）
    var hpRatio = player.maxHealth > 0 ? player.health / player.maxHealth : 1;
    var wantBerserk = hpRatio <= 0.15 && !player.dead;
    if (wantBerserk !== player.berserk) {
      player.berserk = wantBerserk;
      if (wantBerserk) {
        showToast('🔥 狂暴模式！伤害+50% 爆炸弹 射速+50% 移速+200%', 0xff4422);
        if (sfx) sfx.playLevelUp();
      } else {
        showToast('狂暴模式解除', 0x88ccff);
      }
    }
    // Buff 计时
    if (player.buffs.speed > 0) {
      player.buffs.speed -= dt;
      if (player.buffs.speed <= 0) player.buffs.speed = 0;
    }
    if (player.buffs.damage > 0) {
      player.buffs.damage -= dt;
      if (player.buffs.damage <= 0) player.buffs.damage = 0;
    }
    // health buff 独立计时恢复 maxHealth
    if (player.buffs.healthTimer !== undefined) {
      player.buffs.healthTimer -= dt;
      if (player.buffs.healthTimer <= 0) {
        player.buffs.healthTimer = 0;
        if (player.buffs.healthMax !== undefined) {
          player.maxHealth = player.buffs.healthMax;
          delete player.buffs.healthMax;
          player.health = Math.min(player.health, player.maxHealth);
        }
      }
    }

    // 换弹计时
    if (player.reloading) {
      player.reloadTimer -= dt;
      if (player.reloadTimer <= 0) {
        var gt = GUN_TYPES[player.gun];
        var need = gt.mag - player.ammo;
        var take = Math.min(need, player.reserve);
        player.ammo += take;
        player.reserve -= take;
        player.reloading = false;
      }
    }

    if (player.fireCooldown > 0) player.fireCooldown -= dt;

    if (player.dead) return;

    if (player.firing && player.fireCooldown <= 0) tryShoot();

    if (debugMode) {
      camera.getWorldDirection(forward);
      tmpVec.set(0, 0, 0);
      var dSpeed = (W.playerSpeed || 6) * 2.2;
      if (keys.KeyW) tmpVec.addScaledVector(forward, dSpeed * dt);
      if (keys.KeyS) tmpVec.addScaledVector(forward, -dSpeed * dt);
      right.crossVectors(forward, camera.up).normalize();
      if (keys.KeyD) tmpVec.addScaledVector(right, dSpeed * dt);
      if (keys.KeyA) tmpVec.addScaledVector(right, -dSpeed * dt);
      if (keys.Space) tmpVec.y += dSpeed * dt;
      if (keys.ControlLeft || keys.ControlRight) tmpVec.y -= dSpeed * dt;
      player.pos.add(tmpVec);
      return;
    }

    var speedMul = (player.buffs.speed > 0 ? 2.0 : 1) * (player.berserk ? 3 : 1);
    var speed = ((keys.ShiftLeft || keys.ShiftRight) ? (W.sprintSpeed || 9) : (W.playerSpeed || 6)) * speedMul;

    forward.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    tmpVec.set(0, 0, 0);
    if (keys.KeyW || _testForward) tmpVec.addScaledVector(forward, 1);
    if (keys.KeyS) tmpVec.addScaledVector(forward, -1);
    if (keys.KeyD) tmpVec.addScaledVector(right, 1);
    if (keys.KeyA) tmpVec.addScaledVector(right, -1);
    if (tmpVec.lengthSq() > 0) tmpVec.normalize().multiplyScalar(speed);

    player.vel.x = tmpVec.x;
    player.vel.z = tmpVec.z;
    player.vel.y += (W.gravity || -22) * dt;

    if (keys.Space && player.onGround) {
      player.vel.y = W.jumpSpeed || 8;
      player.onGround = false;
    }

    player.pos.addScaledVector(player.vel, dt);

    collideWorld();

    if (player.pos.y < 0) {
      player.pos.y = 0;
      player.vel.y = 0;
      player.onGround = true;
    } else if (player.vel.y <= 0 && player.onGround) {
      player.vel.y = 0;
    }

    checkPickups();
  }

  var playerRadius = W.playerRadius || 0.4;
  var playerHeight = W.playerHeight || 1.7;

  function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function collideWorld() {
    var r = playerRadius;
    // 第一遍：高碰撞体（顶部高于脚面 + 0.38）→ 水平推挤
    for (var i = 0; i < colliders.length; i++) {
      var rec = colliders[i];
      if (!rec.alive) continue;
      box.setFromObject(rec.inst);
      var topY = box.max.y;
      if (topY - player.pos.y <= 0.38) continue; // 低台阶：只踩踏不阻挡

      var cx = clamp(player.pos.x, box.min.x, box.max.x);
      var cz = clamp(player.pos.z, box.min.z, box.max.z);
      var dx = player.pos.x - cx;
      var dz = player.pos.z - cz;
      var d2 = dx * dx + dz * dz;
      if (d2 < r * r) {
        if (d2 > 1e-8) {
          var d = Math.sqrt(d2);
          var push = (r - d) / d;
          player.pos.x += dx * push;
          player.pos.z += dz * push;
        } else {
          var px = Math.min(player.pos.x - box.min.x, box.max.x - player.pos.x);
          var pz = Math.min(player.pos.z - box.min.z, box.max.z - player.pos.z);
          if (px < pz) player.pos.x = (player.pos.x - box.min.x < box.max.x - player.pos.x) ? box.min.x - r : box.max.x + r;
          else player.pos.z = (player.pos.z - box.min.z < box.max.z - player.pos.z) ? box.min.z - r : box.max.z + r;
        }
      }
    }
    // 第二遍：低台阶（顶部在脚面附近）→ 逐级踩踏
    var stepped = true, guard = 0;
    while (stepped && guard < 8) {
      stepped = false;
      guard++;
      for (var j = 0; j < colliders.length; j++) {
        var rec2 = colliders[j];
        if (!rec2.alive) continue;
        box.setFromObject(rec2.inst);
        var diff = box.max.y - player.pos.y;
        if (diff <= 0 || diff > 0.38) continue;
        if (player.pos.x > box.min.x - r * 0.8 && player.pos.x < box.max.x + r * 0.8 &&
            player.pos.z > box.min.z - r * 0.8 && player.pos.z < box.max.z + r * 0.8) {
          player.pos.y = box.max.y;
          player.vel.y = 0;
          player.onGround = true;
          stepped = true;
        }
      }
    }
  }

  function checkPickups() {
    for (var i = entities.length - 1; i >= 0; i--) {
      var rec = entities[i];
      if (!rec.alive || !rec.cfg.kind) continue;
      var dx = rec.inst.position.x - player.pos.x;
      var dy = rec.inst.position.y - player.pos.y;
      var dz = rec.inst.position.z - player.pos.z;
      if (dx * dx + dy * dy + dz * dz < 1.8 * 1.8) {
        applyPickup(rec);
      }
    }
  }

  /** 敌人与静态碰撞体（建筑/墙/车辆/箱子等）的水平推挤，防止穿模 */
  function collideEnemies() {
    var ab = new THREE.Box3();
    for (var i = 0; i < entities.length; i++) {
      var rec = entities[i];
      if (!rec.alive || rec.cfg.model !== 'enemy') continue;
      var u = rec.inst.userData;
      if (u && u.dead) continue;
      rec.inst.updateMatrixWorld(true);
      var r = (rec.inst.scale.x || 1) * 0.38;
      for (var j = 0; j < colliders.length; j++) {
        var c = colliders[j];
        if (!c.alive) continue;
        c.inst.updateMatrixWorld(true);
        ab.setFromObject(c.inst);
        var cx = clamp(rec.inst.position.x, ab.min.x, ab.max.x);
        var cz = clamp(rec.inst.position.z, ab.min.z, ab.max.z);
        var dx = rec.inst.position.x - cx;
        var dz = rec.inst.position.z - cz;
        var d2 = dx * dx + dz * dz;
        if (d2 < r * r && d2 > 1e-8) {
          var d = Math.sqrt(d2);
          var push = (r - d) / d;
          rec.inst.position.x += dx * push;
          rec.inst.position.z += dz * push;
        } else if (d2 <= 1e-8) {
          var px = Math.min(rec.inst.position.x - ab.min.x, ab.max.x - rec.inst.position.x);
          var pz = Math.min(rec.inst.position.z - ab.min.z, ab.max.z - rec.inst.position.z);
          if (px < pz) rec.inst.position.x = (rec.inst.position.x - ab.min.x < ab.max.x - rec.inst.position.x) ? ab.min.x - r : ab.max.x + r;
          else rec.inst.position.z = (rec.inst.position.z - ab.min.z < ab.max.z - rec.inst.position.z) ? ab.min.z - r : ab.max.z + r;
        }
      }
    }
  }

  /* ================= 13. 实体更新循环（含 respawn / 移除） ================= */
  function updateEntities(dt) {
    for (var i = 0; i < entities.length; i++) {
      var rec = entities[i];
      if (!rec.alive) {
        rec.respawnTimer -= dt;
        if (rec.respawnTimer <= 0) {
          if (rec.cfg.respawn === 0) destroyEntity(rec);
          else rebuildEntity(rec);
        }
        continue;
      }
      if (rec.def && typeof rec.def.update === 'function') {
        try {
          rec.def.update(rec.inst, dt, ctx);
        } catch (e) {
          showError('实体更新失败 (' + rec.cfg.id + '): ' + e.message);
        }
        if (rec.inst.userData && rec.inst.userData.respawnReady) {
          if (rec.cfg.respawn === 0) destroyEntity(rec);
          else respawnEntity(rec);
        }
      }
    }
  }

  function rebuildEntity(rec) {
    var cfg = rec.cfg;
    var def = window.MODELS && window.MODELS[cfg.model];
    var inst = null;
    if (def && def.create) {
      try {
        ctx.spawnPos.set(cfg.position[0], cfg.position[1], cfg.position[2]);
        inst = def.create(cfg, ctx);
      } catch (e) {
        showError('重生创建失败 (' + cfg.id + '): ' + e.message);
        inst = null;
      }
    }
    if (!inst) inst = fallbackInst(cfg);
    applyTransform(inst, cfg);
    scene.add(inst);
    inst.traverse(function (o) {
      if (o.isMesh) { o.userData.entityId = cfg.id; o.userData.hitTarget = true; }
    });
    rec.inst = inst;
    rec.alive = true;
    rec.spawnTime = ctx.time;
    if (cfg.collision && colliders.indexOf(rec) < 0) colliders.push(rec);
  }

  /* ================= 14. 特效更新 ================= */
  function updateFx(dt) {
    for (var i = fx.length - 1; i >= 0; i--) {
      var f = fx[i];
      f.life -= dt;
      if (f.type === 'spark' && f.vel) {
        f.obj.position.addScaledVector(f.vel, dt);
        f.vel.multiplyScalar(0.88);
        f.obj.material.opacity = Math.max(0, f.life / f.maxLife);
      } else if (f.type === 'tracer') {
        f.obj.material.opacity = Math.max(0, f.life / f.maxLife);
      } else if (f.type === 'ring') {
        var s1 = 1 + (1 - f.life / f.maxLife) * 2.2;
        f.obj.scale.set(s1, s1, s1);
        f.obj.material.opacity = Math.max(0, f.life / f.maxLife) * 0.9;
      } else if (f.type === 'fireball') {
        var k1 = 1 - f.life / f.maxLife;
        var r1 = 0.5 + k1 * (f.growTo || 3);
        f.obj.scale.set(r1, r1, r1);
        f.obj.material.opacity = Math.max(0, f.life / f.maxLife);
      } else if (f.type === 'shockwave') {
        var k2 = 1 - f.life / f.maxLife;
        var r2 = 0.7 + k2 * (f.growTo || 8);
        f.obj.scale.set(r2, r2, r2);
        f.obj.material.opacity = Math.max(0, f.life / f.maxLife) * 0.85;
      } else if (f.type === 'smoke') {
        f.obj.position.addScaledVector(f.vel, dt);
        var k3 = 1 - f.life / f.maxLife;
        f.obj.scale.setScalar(0.5 + k3 * (f.growTo || 2.4));
        f.obj.material.opacity = Math.max(0, f.life / f.maxLife) * 0.5;
      } else if (f.type === 'flame') {
        f.obj.position.addScaledVector(f.vel, dt);
        f.vel.multiplyScalar(0.94);
        var k4 = f.life / f.maxLife;
        f.obj.scale.setScalar(0.5 + (1 - k4) * 1.0);
        f.obj.material.opacity = k4 * 0.8;
        // 火焰变色：黄→橙→红
        var c = new THREE.Color().setHSL(0.06 * k4, 1, 0.5);
        f.obj.material.color.copy(c);
      } else if (f.type === 'flashlight') {
        f.obj.intensity = 8 * Math.max(0, f.life / f.maxLife);
      } else if (f.type === 'debris') {
        f.obj.position.addScaledVector(f.vel, dt);
        f.vel.y += -22 * dt;
        f.obj.rotation.x += f.rot.x * dt;
        f.obj.rotation.y += f.rot.y * dt;
        f.obj.rotation.z += f.rot.z * dt;
        f.obj.material.opacity = Math.max(0, f.life / f.maxLife);
        if (f.obj.position.y < 0.05) {
          f.obj.position.y = 0.05;
          f.vel.y *= -0.3;
          f.vel.x *= 0.7;
          f.vel.z *= 0.7;
        }
      }
      if (f.life <= 0) {
        scene.remove(f.obj);
        if (f.obj.geometry) f.obj.geometry.dispose();
        if (f.obj.material) f.obj.material.dispose();
        fx.splice(i, 1);
      }
    }
    if (muzzleLight.intensity > 0) muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 30);
  }

  /* ================= 15. HUD ================= */
  var fpsFrames = 0, fpsTime = 0, fpsValue = 0;
  function updateHud(dt) {
    var L = getLevel();
    var gt = GUN_TYPES[player.gun];
    var lines = [];
    if (state === 'complete') lines.push('★ 任务完成 — 按 Enter 进入下一关');
    if (state === 'dead') lines.push('GAME OVER');
    lines.push(L.name + '  「' + L.title + '」');
    lines.push('任务: ' + L.mission);
    if (L.boss) {
      lines.push('击杀 ' + Math.min(levelKills, L.boss.trigger) + '/' + L.boss.trigger +
        (bossAppeared ? (bossAlive ? '  ·  ⚠ BOSS 对战中!' : '  ·  BOSS 已击败') : '  ·  BOSS 未出现'));
    } else {
      lines.push('击杀 ' + Math.min(levelKills, L.killTarget) + '/' + L.killTarget);
    }
    lines.push('HP   ' + Math.max(0, Math.round(player.health)) + '/' + player.maxHealth);
    lines.push(gt.name + '  ' + (gt.flame ? (Math.ceil(player.ammo * 100) / 100) : player.ammo) + '/' + player.reserve +
      (gt.flame ? '发(≈' + Math.floor(player.ammo * 15) + '秒)' : '') +
      (player.reloading ? '  [换弹中]' : ''));
    var buffs = [];
    if (player.berserk) buffs.push('🔥狂暴(伤害+50% 爆炸 射速+50% 移速×3)');
    if (player.buffs.speed > 0) buffs.push('疾风 ' + Math.ceil(player.buffs.speed) + 's');
    if (player.buffs.damage > 0) buffs.push('狂暴 ' + Math.ceil(player.buffs.damage) + 's');
    if (player.buffs.healthTimer !== undefined) buffs.push('体魄 ' + Math.ceil(player.buffs.healthTimer) + 's');
    if (buffs.length) lines.push('Buff: ' + buffs.join('  |  '));
    if (player.nukes > 0) lines.push('☢ 核弹 ×' + player.nukes + '  — 按 G 引爆');
    if (debugMode) lines.push('DEBUG 飞行模式');
    lines.push('SCORE ' + score);
    statsEl.textContent = lines.join('\n');

    fpsFrames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
      fpsValue = Math.round(fpsFrames / fpsTime);
      fpsFrames = 0; fpsTime = 0;
    }
    fpsEl.textContent = 'FPS ' + fpsValue;
  }

  /* ================= 16. 相机同步 ================= */
  function updateCamera(dt) {
    var shakeX = 0, shakeY = 0;
    if (screenShake > 0) {
      screenShake = Math.max(0, screenShake - dt * 2.4);
      var s = screenShake * screenShake * 0.18;
      shakeX = (Math.random() - 0.5) * s;
      shakeY = (Math.random() - 0.5) * s;
    }
    camera.position.set(player.pos.x + shakeX, player.pos.y + (W.eyeHeight || 1.6) + shakeY, player.pos.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
    if (gunInst && window.MODELS.gun && typeof window.MODELS.gun.update === 'function') {
      window.MODELS.gun.update(gunInst, dt, ctx);
    }
  }

  /* ================= 17. 主循环 ================= */
  var lastTime = performance.now();
  var loopCount = 0;
  var _lastDt = 0;
  var _flameHitCount = 0;
  var _testForward = false;
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    _lastDt = dt;
    loopCount++;

    try {
      if (state === 'playing') {
        ctx.time += dt;
        updatePlayer(dt);
        updateRockets(dt);
        updateEntities(dt);
        collideEnemies();
        updateWaves(dt);
        updateFx(dt);
      } else {
        updateFx(dt * 0.6);
      }
      updateCamera(dt);
      updateHud(dt);
      renderer.render(scene, camera);
    } catch (e) {
      showError('主循环错误: ' + e.message);
    }
  }

  /* ================= 18. 窗口大小 ================= */
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (layoutMissing) overlaySub.textContent = '（场景布局缺失，使用默认场景）按 Enter 开始游戏';
  requestAnimationFrame(loop);

  /* ================= 19. 测试钩子（仅 #test 模式，正常游玩不生效） ================= */
  if (location.hash === '#test') {
    var tBar = document.getElementById('fpsTestBar');
    if (tBar) {
      tBar.style.display = 'block';
      document.getElementById('tSetKills').addEventListener('click', function () {
        levelKills = getLevel().killTarget;
      });
      document.getElementById('tNext').addEventListener('click', function () {
        if (state === 'complete') nextLevel();
      });
      document.getElementById('tComplete').addEventListener('click', completeLevel);
    }
    window.__fpsTest = {
      getState: function () {
        return {
          state: state, levelIndex: levelIndex, levelKills: levelKills,
          levelCleared: levelCleared, waveQueueLen: waveQueue.length,
          boss: { appeared: bossAppeared, alive: bossAlive },
          enemyCount: entities.filter(function (e) { return e.cfg && e.cfg.enemyType; }).length, killTarget: getLevel().killTarget,
          chest: { levelHasChest: levelHasChest, spawned: chestSpawnedThisLevel, count: chestSpawnedCount,
                   chests: entities.filter(function (e) { return e.cfg && e.cfg.kind === 'chest'; }).length },
          buffs: { speed: Math.round((player.buffs.speed || 0) * 10) / 10, damage: Math.round((player.buffs.damage || 0) * 10) / 10,
                   healthTimer: Math.round((player.buffs.healthTimer === undefined ? 0 : player.buffs.healthTimer) * 10) / 10,
                   healthMax: player.buffs.healthMax },
          nukes: player.nukes,
          playerPos: player.pos ? { x: player.pos.x.toFixed(2), y: player.pos.y.toFixed(2), z: player.pos.z.toFixed(2) } : null,
          gun: player.gun, ammo: Math.round(player.ammo * 100) / 100, reserve: player.reserve,
          flameReserve: player.flameReserve, berserk: player.berserk,
          hp: Math.round(player.health), maxHp: player.maxHealth, firing: !!player.firing,
          fireCd: Math.round(player.fireCooldown * 100) / 100, reloading: !!player.reloading,
          loopCount: loopCount, lastDt: Math.round(_lastDt * 1000), flameHits: _flameHitCount,
          flameDiag: (function () {
            try {
              var o = getMuzzleWorld();
              var d = new THREE.Vector3();
              camera.getWorldDirection(d);
              var arr = [];
              for (var i = 0; i < entities.length; i++) {
                var rec = entities[i];
                if (!rec.alive) continue;
                if (!rec.cfg.enemyType && rec.cfg.model !== 'helicopter') continue;
                var E = rec.inst.position;
                var pTo = new THREE.Vector3().subVectors(E, o);
                var pToXZ = new THREE.Vector3(pTo.x, 0, pTo.z);
                var dXZ = new THREE.Vector3(d.x, 0, d.z).normalize();
                var t = pToXZ.dot(dXZ);
                var hDist = pToXZ.distanceTo(dXZ.clone().multiplyScalar(t));
                var hitR = 0.5 + (GUN_TYPES[player.gun].flameRadius || 3) * (t / GUN_TYPES[player.gun].range);
                arr.push({ m: rec.cfg.model, p: [E.x.toFixed(1), E.y.toFixed(1), E.z.toFixed(1)], t: t.toFixed(2), hDist: hDist.toFixed(2), v: pTo.y.toFixed(2), hitR: hitR.toFixed(2) });
              }
              return { o: [o.x.toFixed(2), o.y.toFixed(2), o.z.toFixed(2)], d: [d.x.toFixed(3), d.y.toFixed(3), d.z.toFixed(3)], n: arr.length, e: arr.slice(0, 5) };
            } catch (err) { return { err: err.message }; }
          })(),
          healthDrops: entities.filter(function (e) { return e.cfg && e.cfg.dynamic && e.cfg.kind === 'health'; }).length,
          flameDrops: entities.filter(function (e) { return e.cfg && e.cfg.dynamic && e.cfg.kind === 'ammo' && e.cfg.type === 'flame'; }).length
        };
      }
    };
    // 键盘触发（指针锁定下鼠标点击不可用）：K=击杀达标+通关判定, L=complete 状态进下一关,
    // F=持续开火开关, H=血量压到15%（触发狂暴）, M=满血（解除狂暴）
    document.addEventListener('keydown', function (e) {
      if (e.code === 'KeyK') { levelKills = getLevel().killTarget; checkMissionComplete(); }
      if (e.code === 'KeyL' && state === 'complete') nextLevel();
      if (e.code === 'KeyF') player.firing = !player.firing;
      if (e.code === 'KeyH') player.health = player.maxHealth * 0.15;
      if (e.code === 'KeyM') player.health = player.maxHealth;
      // J/I：正前方 10m/8m 刷 human/spider（测试火焰伤害）
      if (e.code === 'KeyJ' || e.code === 'KeyI') {
        var fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        var p2 = player.pos.clone().addScaledVector(fwd, e.code === 'KeyJ' ? 10 : 8);
        spawnEnemy(e.code === 'KeyJ' ? 'human' : 'spider', p2);
      }
      // C：强制本关出宝箱（测试宝箱道具）；O：在正前方 3m 直接刷一个宝箱（测试拾取）；N：直接给 1 枚核弹（测试核弹）
      if (e.code === 'KeyC') { levelHasChest = true; }
      if (e.code === 'KeyO') {
        var fwd2 = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        spawnChest(player.pos.clone().addScaledVector(fwd2, 3));
      }
      if (e.code === 'KeyN') { player.nukes += 1; }
      // V：自动前进开关（测试移动速度）
      if (e.code === 'KeyV') _testForward = !_testForward;
    });
    setInterval(function () {
      var el = document.getElementById('tState');
      if (el && window.__fpsTest) el.textContent = JSON.stringify(window.__fpsTest.getState());
    }, 300);
  }
})();
</script>
